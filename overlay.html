<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:L;src:url(LilitaOne.ttf)}@font-face{font-family:N;src:url(Nunito.ttf)}
html,body{margin:0;background:transparent}
.c{width:1080px;height:1920px;position:relative;--l:56px;--t:236px}
.cta{position:absolute;left:var(--l);top:var(--t);display:flex;align-items:center;gap:18px;background:#C2412A;color:#FFFBF3;padding:14px 34px 14px 14px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.cta img{width:78px;height:78px;border-radius:50%;background:#FFFBF3;object-fit:contain;padding:4px;box-sizing:border-box}
.cta b{display:block;font:400 44px/1 L}
.cta i{display:block;font:800 26px/1 N;font-style:normal;opacity:.92;margin-top:6px}

.A .cta{animation:fade .5s ease .6s both}
/* only motion after the intro: Cookie turns slowly clockwise; the button itself stays still */
.cta img{animation:spin 8s linear infinite}
.L .cta img{animation-delay:-1.5s}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><div class="c __MODE__">
<div class=cta><img src=cookie.webp><div><b>Get ads like this</b><i>cookshipcreatives.com</i></div></div>
</div></body></html>
